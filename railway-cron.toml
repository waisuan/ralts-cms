# Cron sync service – weekly Postgres + S3 sync from legacy roti to Railway.
# In Railway: create a new service in the project, set Config File Path to
# /railway-cron.toml, Root Directory to / (default).
#
# Required env vars (set in Railway dashboard):
#   SOURCE_DATABASE_URL, TARGET_DATABASE_URL (Postgres)
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION (legacy AWS)
#   SOURCE_S3_BUCKET, TARGET_S3_BUCKET, TARGET_S3_ENDPOINT,
#   TARGET_S3_ACCESS_KEY_ID, TARGET_S3_SECRET_ACCESS_KEY (S3 sync)

[build]
dockerfilePath = "Dockerfile.migrate"
watchPatterns = ["scripts/migrate-data.sh", "Dockerfile.migrate", "railway-cron.toml"]

[deploy]
cronSchedule = "0 2 * * 1"
