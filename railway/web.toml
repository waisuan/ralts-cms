# Web API service – Go HTTP API, always on.
# In Railway: connect this service to the repo, set Config File Path to /railway/web.toml.
# Root Directory: / (default)

[build]
buildCommand = "go build -o bin/ralts-cms ./cmd/web"
watchPatterns = ["cmd/**", "internal/**", "pkg/**", "db/**", "go.mod", "go.sum", "railway/web.toml"]

[deploy]
startCommand = "bin/ralts-cms"
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/health"
