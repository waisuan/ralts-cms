# Next.js UI – browser client for Ralts-CMS.
# In Railway: connect this service to the repo, set Config File Path to /railway/ui.toml.
# Root Directory: ui (set in Railway dashboard)

[build]
buildCommand = "npm ci && npm run build"
watchPatterns = ["**"]

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/api/health"
