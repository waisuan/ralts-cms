name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install revive
        run: |
          mkdir -p bin
          curl -L https://github.com/mgechev/revive/releases/latest/download/revive_linux_amd64.tar.gz | tar -xz -C bin/ revive
          chmod +x bin/revive

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: bin/revive -formatter friendly ./cmd/... ./internal/... ./pkg/...

      - name: Build
        run: go build -v ./...

      - name: Test
        env:
          APP_ENV: "test"
          AWS_ACCESS_KEY_ID: "test"
          AWS_SECRET_ACCESS_KEY: "test"
          AWS_DEFAULT_REGION: "us-east-1"
          AWS_ENDPOINT_URL: "http://localhost:4566"
          AWS_S3_BUCKET_NAME: "test-bucket"
        run: go test -v ./...

      - name: Integration tests
        env:
          APP_ENV: "test"
        run: go test -tags=integration -count=1 -timeout=15m -v ./internal/integration/...

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ui/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/src/**/*.ts', 'ui/src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('ui/package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Lint
        run: cd ui && npm run lint

      - name: Build
        run: cd ui && npm run build

      - name: Test
        run: cd ui && npm test

  # Browsers and OS libraries ship in the image, so this job never runs
  # `playwright install`. Keep the tag in lockstep with @playwright/test
  # (currently 1.59.1). Caching the browser download is not recommended:
  # https://playwright.dev/docs/ci#caching-browsers
  e2e:
    name: UI e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Playwright matches the image
        run: |
          pkg=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "package $pkg"
          test "$pkg" = "1.59.1"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ui/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/src/**/*.ts', 'ui/src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('ui/package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e
