name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install revive
        run: |
          mkdir -p bin
          curl -L https://github.com/mgechev/revive/releases/latest/download/revive_linux_amd64.tar.gz | tar -xz -C bin/ revive
          chmod +x bin/revive

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: bin/revive -formatter friendly ./cmd/... ./internal/... ./pkg/...

      - name: Build
        run: go build -v ./...

      - name: Test
        env:
          APP_ENV: "test"
          AWS_ACCESS_KEY_ID: "test"
          AWS_SECRET_ACCESS_KEY: "test"
          AWS_DEFAULT_REGION: "us-east-1"
          AWS_ENDPOINT_URL: "http://localhost:4566"
          AWS_S3_BUCKET_NAME: "test-bucket"
        run: go test -v ./...

      - name: Integration tests
        env:
          APP_ENV: "test"
        run: go test -tags=integration -count=1 -timeout=15m -v ./internal/integration/...

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ui/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/src/**/*.ts', 'ui/src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('ui/package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Lint
        run: cd ui && npm run lint

      - name: Build
        run: cd ui && npm run build

      - name: Test
        run: cd ui && npm test

      # Chromium is ~150MB and the OS libraries come from apt. Cache the
      # browser so later runs skip the download; deps are still installed on a
      # hit because they live on the runner, not in the cache.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./ui/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd ui && npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd ui && npx playwright install-deps chromium

      - name: E2E tests
        run: cd ui && npm run test:e2e
