name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install revive
        run: |
          mkdir -p bin
          curl -L https://github.com/mgechev/revive/releases/latest/download/revive_linux_amd64.tar.gz | tar -xz -C bin/ revive
          chmod +x bin/revive

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: bin/revive -formatter friendly ./cmd/... ./internal/... ./pkg/...

      - name: Build
        run: go build -v ./...

      - name: Test
        env:
          APP_ENV: "test"
          AWS_ACCESS_KEY_ID: "test"
          AWS_SECRET_ACCESS_KEY: "test"
          AWS_DEFAULT_REGION: "us-east-1"
          AWS_ENDPOINT_URL: "http://localhost:4566"
          AWS_S3_BUCKET_NAME: "test-bucket"
        run: go test -v ./...

      - name: Integration tests
        env:
          APP_ENV: "test"
        run: go test -tags=integration -count=1 -timeout=15m -v ./internal/integration/...

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Lint
        run: cd ui && npm run lint

      - name: Build
        run: cd ui && npm run build

      - name: Test
        run: cd ui && npm test

      - name: Install Playwright browsers
        run: cd ui && npx playwright install --with-deps chromium

      - name: E2E tests
        run: cd ui && npm run test:e2e
