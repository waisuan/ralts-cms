# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Backend

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Install tools
      run: |
        mkdir -p bin

        # Install revive linter
        curl -L https://github.com/mgechev/revive/releases/latest/download/revive_linux_amd64.tar.gz | tar -xz -C bin/ revive
        chmod +x bin/revive

        # Verify installations
        bin/revive --version

    - name: Vet
      run: go vet ./...

    - name: Lint
      run: bin/revive -formatter friendly ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      env:
        APP_ENV: "test"
        AWS_ACCESS_KEY_ID: "test"
        AWS_SECRET_ACCESS_KEY: "test" 
        AWS_DEFAULT_REGION: "us-east-1"
        AWS_ENDPOINT_URL: "http://localhost:4566"
        S3_BUCKET_NAME: "test-bucket"
      run: go test -v ./...
